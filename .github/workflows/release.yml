name: Build and Release HEW Game

on:
  workflow_dispatch:

env:
  VERSION_FILE: .github/version.txt

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get Version
      id: version
      shell: powershell
      run: |
        if (Test-Path "${{ env.VERSION_FILE }}") {
          $version = Get-Content "${{ env.VERSION_FILE }}" -Raw
        } else {
          $version = "1"
        }
        Write-Output "number=$version" >> $env:GITHUB_OUTPUT

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Clean
      run: msbuild "Project1.sln" /t:Clean /p:Configuration="Release" /p:Platform="x64"

    - name: Build with MSBuild
      run: msbuild "Project1.sln" /p:Configuration="Release" /p:Platform="x64" /m /v:minimal

    - name: Collect files
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path "release" -Force | Out-Null
        
        Copy-Item -Path "x64/Release/*.exe" -Destination "release" -Force
        Copy-Item -Path "x64/Release/*.cso" -Destination "release" -Force
        # プロジェクトルートに出力されたcsoファイルも収集
        if (Test-Path "*.cso") {
            Copy-Item -Path "*.cso" -Destination "release" -Force
        }
        Copy-Item -Path "x64/Release/*.dll" -Destination "release" -Force
        Copy-Item -Path "assimp-vc143-mt.dll" -Destination "release" -Force
        Copy-Item -Path "asset" -Destination "release" -Recurse -Force
        Copy-Item -Path "SchemToArray" -Destination "release" -Recurse -Force
        Copy-Item -Path "server_config.txt" -Destination "release" -Force
        
        Compress-Archive -Path "release/*" -DestinationPath "HEW_YUREIHEN_BUILD_v${{ steps.version.outputs.number }}.zip" -Force

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: HEW_YUREIHEN_BUILD_v${{ steps.version.outputs.number }}.zip
        generate_release_notes: true
        tag_name: v${{ steps.version.outputs.number }}
        name: v${{ steps.version.outputs.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Version
      shell: powershell
      run: |
        $version = [int]"${{ steps.version.outputs.number }}" + 1
        New-Item -ItemType Directory -Path ".github" -Force | Out-Null
        Set-Content -Path "${{ env.VERSION_FILE }}" -Value $version

    - name: Push Version Update
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .github/version.txt
        git commit -m "bump version to v${{ steps.version.outputs.number }}"
        git push
