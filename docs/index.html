<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violisun</title>
    <style>
        /* 全体の背景と文字の基本設定 */
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            /* 深い紫から少し明るい紫へのグラデーション背景 */
            background: linear-gradient(135deg, #1a0033 0%, #4b0082 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* タイトル「Violisun」のデザイン */
        h1.title {
            font-size: 5rem; /* 文字を大きく */
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(216, 180, 254, 0.6); /* ぼんやり光るエフェクト */
        }

        /* サブタイトルのデザイン */
        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 50px;
            color: #d8b4fe; /* 薄い紫色 */
        }
https://github.com/realryo1/YUREIHEN-alpha/blob/master/docs/index.html
        /* ボタンを横に並べるための設定 */
        .button-container {
            display: flex;
            gap: 30px; /* ボタン同士の隙間 */
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ボタンのデザイン */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #8b5cf6; /* 鮮やかな紫色 */
            text-decoration: none;
            border-radius: 50px; /* 丸みのあるボタン */
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.5);
            transition: all 0.3s ease; /* アニメーションの動きを滑らかに */
        }

        /* ボタンにマウスを乗せたとき（ホバー時）の動き */
        .btn:hover {
            background-color: #7c3aed; /* 少し濃い紫に変化 */
            transform: translateY(-5px); /* 少し上に浮く */
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.8);
        }
    </style>
</head>
<body>

    <h1 class="title">Violisun</h1>
    <p class="subtitle">プレイ動画を公開しています、ぜひ投票をお願いします</p>
    
    <div class="button-container">
        <a href="https://youtu.be/-TdYhRSrVFA" class="btn">動画を見る</a>
        
        <a href="https://forms.office.com/r/v1bKtf4qqM" class="btn">投票に行く</a>
    </div>

</body>
</html>
